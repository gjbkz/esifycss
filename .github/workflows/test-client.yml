name: TestClient
on:
  pull_request:
  workflow_dispatch:
jobs:
  TestClient:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency: test-client
    permissions:
      contents: read
    steps:
      - name: Check BrowserStack credentials
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::Set BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY repository secrets to run TestClient."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test-client
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-client-screenshots
          path: packages/esifycss/test-client/*/output/*.png
          if-no-files-found: ignore
